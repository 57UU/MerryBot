<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --font-scale: {{fontScale}};
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.35;
            word-wrap: break-word;
            padding: 10px;
            margin: 0;
            background-color: white;
            color: #24292e;
        }
        p, ul, ol, dl, table, pre, blockquote {
            margin-top: 0;
            margin-bottom: 6px;
        }
        ul, ol {
            padding-left: 20px;
        }
        li > p {
            margin-bottom: 0;
        }
        pre {
            padding: 8px;
            overflow: auto;
            font-size: 90%;
            line-height: 1.25;
            background-color: #f6f8fa;
            border-radius: 4px;
        }
        code {
            padding: 0.1em 0.3em;
            margin: 0;
            font-size: 90%;
            background-color: rgba(27,31,35,0.05);
            border-radius: 3px;
        }
        pre code {
            padding: 0;
            background-color: transparent;
            border-radius: 0;
        }
        blockquote {
            padding: 0 0.8em;
            color: #6a737d;
            border-left: 0.2em solid #dfe2e5;
            margin-bottom: 6px;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-bottom: 6px;
            width: 100%;
        }
        table th, table td {
            padding: 2px 6px;
            border: 1px solid #dfe2e5;
        }
        table tr {
            background-color: #fff;
            border-top: 1px solid #c6cbd1;
        }
        table tr:nth-child(2n) {
            background-color: #f6f8fa;
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 10px;
            margin-bottom: 6px;
            font-weight: 600;
            line-height: 1.2;
        }
        h1 { padding-bottom: 0.2em; border-bottom: 1px solid #eaecef; font-size: 1.8em; }
        h2 { padding-bottom: 0.2em; border-bottom: 1px solid #eaecef; font-size: 1.4em; }
        h3 { font-size: 1.2em; }
        hr { height: 0.15em; padding: 0; margin: 10px 0; background-color: #e1e4e8; border: 0; }
        img { max-width: 100%; }
        li + li { margin-top: 0.1em; }
    </style>
</head>
<body>
    {{content}}
</body>
</html>
