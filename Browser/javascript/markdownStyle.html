<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --font-scale: {{fontScale}};
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
            font-size: calc(14px * var(--font-scale));
            line-height: 1.5;
            overflow-wrap: break-word;
            word-break: normal;
            text-align: left;
            padding: 10px;
            margin: 0;
            background-color: white;
            color: #24292e;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            hyphens: none;
            letter-spacing: normal;
            font-variant-ligatures: none;
        }
        p, ul, ol, dl, table, pre, blockquote {
            margin-top: 0;
            margin-bottom: 6px;
        }
        ul, ol {
            padding-left: 20px;
        }
        li > p {
            margin-bottom: 0;
        }
        pre, code {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        pre {
            padding: 8px;
            overflow: auto;
            font-size: 90%;
            line-height: 1.25;
            background-color: #f6f8fa;
            border-radius: 4px;
        }
        code {
            padding: 0.1em 0.3em;
            margin: 0;
            font-size: 90%;
            background-color: rgba(27,31,35,0.05);
            border-radius: 3px;
        }
        pre code {
            padding: 0;
            background-color: transparent;
            border-radius: 0;
        }
        blockquote {
            padding: 0 0.8em;
            color: #6a737d;
            border-left: 0.2em solid #dfe2e5;
            margin-bottom: 6px;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-bottom: 6px;
            width: 100%;
        }
        table th, table td {
            padding: 2px 6px;
            border: 1px solid #dfe2e5;
        }
        table tr {
            background-color: #fff;
            border-top: 1px solid #c6cbd1;
        }
        table tr:nth-child(2n) {
            background-color: #f6f8fa;
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 10px;
            margin-bottom: 6px;
            font-weight: 600;
            line-height: 1.2;
        }
        h1 { padding-bottom: 0.2em; border-bottom: 1px solid #eaecef; font-size: 1.8em; }
        h2 { padding-bottom: 0.2em; border-bottom: 1px solid #eaecef; font-size: 1.4em; }
        h3 { font-size: 1.2em; }
        hr { height: 0.15em; padding: 0; margin: 10px 0; background-color: #e1e4e8; border: 0; }
        img { max-width: 100%; }
        li + li { margin-top: 0.1em; }

        /* Mermaid 样式微调 */
        .mermaid {
            background-color: transparent !important;
            border: none !important;
            text-align: center;
        }
        /* 公式样式微调 */
        .math {
            font-size: 1.1em;
            /* 避免公式在渲染前换行或显示不正常 */
            display: inline-block;
            white-space: nowrap;
            margin: 0 0.1em;
        }
        .math-display {
            display: block;
            margin: 0.3em 0;
            padding: 0.1em 0;
            text-align: center;
            line-height: 1.2;
            overflow-x: auto;
            overflow-y: hidden;
        }
        /* MathJax 渲染后的容器样式 */
        mjx-container[display="true"] {
            margin: 0.4em 0 !important;
            padding: 0.1em 0;
        }
    </style>
</head>
<body>
    {{content}}
    <script>
        window.renderComplete = false;
        // MathJax 配置
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global' // 使用全局字体缓存，减小 SVG 体积
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                processHtmlClass: 'math|math-display'
            }
        };
    </script>
    <script>{{mermaidJs}}</script>
    <script>{{mathJaxJs}}</script>
    <script>
        async function renderAll() {
            // 1. 等待 MathJax 核心对象就绪
            let waitCount = 0;
            while (typeof MathJax === 'undefined' || !MathJax.startup || !MathJax.typesetPromise) {
                await new Promise(r => setTimeout(r, 50));
                if (waitCount++ > 100) break;
            }

            if (typeof MathJax !== 'undefined' && MathJax.startup && MathJax.startup.promise) {
                await MathJax.startup.promise;
            }

            const promises = [];

            // 2. Mermaid 渲染
            if (typeof mermaid !== 'undefined') {
                // 将代码块转换为 mermaid div
                document.querySelectorAll('code.language-mermaid').forEach(code => {
                    const pre = code.parentElement;
                    if (pre && pre.tagName === 'PRE') {
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = code.textContent;
                        pre.parentNode.replaceChild(div, pre);
                    }
                });

                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'default',
                    securityLevel: 'loose'
                });
                promises.push(mermaid.run());
            }

            // 3. MathJax 渲染
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                // 强制对所有 .math 元素进行排版
                // 我们不再手动修改内容，直接让 MathJax 处理
                promises.push(MathJax.typesetPromise());
            }

            try {
                await Promise.all(promises);
            } catch (e) {
                console.error("Rendering error:", e);
            } finally {
                // 给一点重绘时间
                setTimeout(() => {
                    window.renderComplete = true;
                }, 150);
            }
        }

        // 在页面加载完成后启动渲染
        if (document.readyState === 'complete') {
            renderAll();
        } else {
            window.addEventListener('load', renderAll);
        }
    </script>
</body>
</html>
